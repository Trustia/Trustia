<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Trustia AI - Tanıtım Filmi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      cursor: none; /* Mouse imlecini tamamen gizler */
    }
    #playerContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ekrana tam oturur, siyah boşluk bırakmaz */
      border: none;
      outline: none;
    }
  </style>
</head>
<body>

  <div id="playerContainer">
    <video id="promoVideo" src="Tanitim_Filmi.mp4" autoplay loop muted playsinline></video>
  </div>

  <script>
    const vid = document.getElementById('promoVideo');

    // Video bitse bile anında baştan başlat (Sonsuz Garanti Döngü)
    vid.addEventListener('ended', () => {
      vid.currentTime = 0;
      vid.play().catch(() => {});
    });

    // Otomatik oynatma güvenliği
    window.addEventListener('load', () => {
      vid.play().catch(() => {
        // Herhangi bir engelleme olursa tek tıkla başlat
        document.body.addEventListener('click', () => {
          vid.play();
        }, { once: true });
      });
    });

    // Mouse hareket edince geçici olarak göster, sonra 2 saniyede yine tamamen yok et
    let hideTimeout;
    window.addEventListener('mousemove', () => {
      document.body.style.cursor = 'default';
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        document.body.style.cursor = 'none';
      }, 2000);
    });

    // Klavyede F veya Space tuşuna basılırsa tam ekran aç/kapat
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
    });
  </script>
</body>
</html>
