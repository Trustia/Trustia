# TRUSTIA SEVİYE-4 OTONOM SÜRÜŞ ÇEKİRDEĞİ — ARAÇ YAPILANDIRMA DOSYASI
# Enterprise Vehicle Configuration (ISO 26262 ASIL-D Compliant)

vehicle:
  name: "Autonomous Vehicle Platform"
  platform_id: "VEH-L4-001"
  wheel_base_m: 3.0
  track_width_m: 1.6
  max_steering_angle_deg: 35.0
  max_speed_kmh: 70.0

can_bus:
  interface: "socketcan"
  channel: "can0"
  protocol: "CAN-FD"
  bitrate: 500000
  data_bitrate: 2000000

sensors:
  lidar:
    model: "Ouster-OS2-128"
    ip: "192.168.1.200"
    port: 7502
    rate_hz: 20
    points_per_second: 2600000
    curb_boundary_detection: true
  gnss_imu:
    enabled: true
    eskf_rate_hz: 400
    fallback_to_lidar_slam: true

safety:
  asil_level: "ASIL-D"
  mrm_safe_stop_enabled: true
  obstacle_clearance_m: 1.5
  self_check_interval_ms: 20.0
  watchdog_timeout_ms: 50.0
  canfd_latency_budget_ms: 1.4
  mrm_safe_pullover_decel_mps2: 1.5
  emergency_stop_decel_mps2: 6.5
  human_override_takeover_ms: 5.0
  dssad_blackbox_enabled: true
  odd_geofence_enforced: true
  sotif_iso21448_enabled: true
