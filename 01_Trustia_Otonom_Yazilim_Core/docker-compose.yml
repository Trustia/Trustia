version: '3.8'

services:
  trustia-autonomy-core:
    build: .
    container_name: trustia_core
    command: python -m pytest
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  trustia-c2-server:
    build: .
    container_name: trustia_c2_server
    command: python -m demos.asama6_bomba_ve_eyp_demo
    environment:
      - PYTHONPATH=/app
