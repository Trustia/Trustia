name: Trustia Continuous Integration & Verification (CI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomy-core-verification:
    name: Seviye-4 Otonomi Çekirdeği 1.350 Birim & Entegrasyon Testi (%100 Yeşil)
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodunu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Bağımlılıklarını Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pyyaml onnx onnxruntime

      - name: 1.329 Otomatik Çekirdek Testini Koştur
        run: |
          cd 01_Trustia_Otonom_Yazilim_Core
          PYTHONPATH=. pytest tests/ -q --tb=short

      - name: 21 Robotaksi SDK Testini Koştur
        run: |
          cd 02_Trustia_Robotaxi_SDK
          PYTHONPATH=. pytest tests/ -q --tb=short

  web-platform-build:
    name: Next.js 16 Web & Telemetri Platformu Derleme Doğrulaması
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodunu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: 02_Trustia_Web_Platformu/website/package-lock.json

      - name: Web Bağımlılıklarını Yükle
        run: npm ci
        working-directory: 02_Trustia_Web_Platformu/website

      - name: Statik Web Çıktısını Derle (Export)
        run: npm run build
        working-directory: 02_Trustia_Web_Platformu/website
