name: Deploy Trustia Web Platform to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 02_Trustia_Web_Platformu/website/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: 02_Trustia_Web_Platformu/website

      - name: Build and Export Next.js Website
        run: npm run build
        working-directory: 02_Trustia_Web_Platformu/website

      - name: Add .nojekyll
        run: touch 02_Trustia_Web_Platformu/website/out/.nojekyll

      - name: Deploy to gh-pages branch (Fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 02_Trustia_Web_Platformu/website/out
          publish_branch: gh-pages

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 02_Trustia_Web_Platformu/website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
