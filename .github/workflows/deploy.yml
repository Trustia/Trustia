name: Deploy Trustia Web Platform to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "02_Trustia_Web_Platformu/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodunu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 02_Trustia_Web_Platformu/website/package-lock.json

      - name: Web Bağımlılıklarını Yükle
        run: npm ci
        working-directory: 02_Trustia_Web_Platformu/website

      - name: Next.js Web ve 3D Konsolu Derle (Export)
        run: npm run build
        working-directory: 02_Trustia_Web_Platformu/website

      - name: Statik Routing Koruması (.nojekyll)
        run: touch 02_Trustia_Web_Platformu/website/out/.nojekyll

      - name: GitHub Pages Dalına Dağıt (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 02_Trustia_Web_Platformu/website/out
          publish_branch: gh-pages

      - name: Sayfa Çıktısını Yükle (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 02_Trustia_Web_Platformu/website/out

      - name: GitHub Pages Üzerinde Yayına Al
        id: deployment
        uses: actions/deploy-pages@v4
